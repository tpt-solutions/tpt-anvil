[package]
name = "tpt-anvil-inference"
description = "Local LLM inference backends for TPT Anvil"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["anvil", "llm", "inference", "ollama", "llama-cpp", "candle", "local-ai"]
categories = ["development-tools", "science"]
documentation = "https://docs.rs/tpt-anvil-inference"
homepage = "https://github.com/tpt-solutions/tpt-anvil"

[features]
default = ["ollama"]
ollama = ["reqwest"]
llama-cpp = ["llama-cpp-2"]
candle = ["candle-core", "candle-transformers", "candle-nn", "hf-hub", "tokenizers"]

# Hardware acceleration (opt-in). These toggle GPU support in the underlying
# inference crates and are surfaced through the `accel` module.
cuda = ["candle-core?/cuda", "candle-nn?/cuda", "candle-transformers?/cuda", "llama-cpp-2?/cuda"]
rocm = ["llama-cpp-2?/rocm"]
webgpu = ["candle-core?/metal"]

[dependencies]
tpt-anvil-core = { path = "../tpt-anvil-core" }
tpt-anvil-config = { path = "../tpt-anvil-config" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }

futures-util = "0.3"

# Ollama backend
reqwest = { workspace = true, optional = true }

# llama.cpp backend (optional)
llama-cpp-2 = { version = "0.1", optional = true }

# candle backend (optional)
candle-core = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
candle-nn = { version = "0.11", optional = true }
hf-hub = { version = "1.0", optional = true }
tokenizers = { version = "0.21", optional = true }
